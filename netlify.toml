# إعداد نشر منصّة وقّاد على Netlify
# خطوةُ بناءٍ خفيفة: تُعيد توليد صفحات SEO والخريطة من طبقة التحكّم عند كل نشر،
# فتبقى الصفحاتُ الثابتة متطابقةً مع لوحة الإدارة. فشلُ البناء يمنع النشر (آمن).

[build]
  publish = "."
  command = "node tools/gen-pages.js"

# الدوالّ الخادميّة (لوحة الإدارة: التحقّق من كلمة المرور والالتزام في GitHub).
[functions]
  directory = "netlify/functions"

# عامل الخدمة والصفحة الرئيسية: لا تُخزَّن في المتصفّح كي يصل التحديث فورًا.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ملفّات الكود والبيانات: راجِعها عند كل زيارة (النسخ تُدار برقم CACHE في sw.js).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
